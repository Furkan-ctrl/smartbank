server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/smartbank_users
    username: ${DB_USERNAME:smartbank}
    password: ${DB_PASSWORD:smartbank123}

  jpa:
